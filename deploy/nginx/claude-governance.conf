# Reverse proxy de la console de gouvernance : http://gouvernance.localhost
# Écoute uniquement sur 127.0.0.1 : rien n'est exposé hors de la machine.
# Les navigateurs résolvent *.localhost vers 127.0.0.1 sans fichier hosts.
server {
    listen 127.0.0.1:80;
    server_name gouvernance.localhost;

    # Dépôt de PDF d'appels d'offres depuis la console (défaut nginx : 1 Mo)
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8788;
        # La console compare Origin à Host pour la protection CSRF : garder le Host d'origine
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # OCR des PDF scannés
    }
}
