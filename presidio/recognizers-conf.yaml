# Registre des détecteurs Presidio. Seul le NER spaCy (personnes, lieux) est utilisé :
# les secrets, e-mails, IBAN, NIR... sont détectés par le proxy (policy.json).
supported_languages:
  - fr
  - en
global_regex_flags: 26
recognizers:
  - name: SpacyRecognizer
    type: predefined
    supported_languages:
      - language: fr
      - language: en
